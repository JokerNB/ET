syntax = "proto3";

package ET;

// 玩家缓存相关

//ResponseType UnitCache2Other_AddOrUpdateUnit
message Other2UnitCache_AddOrUpdateUnit // IRequest
{
  int32 RpcId = 1;
  int64 UnitId = 2; //需要缓存的UnitId
  repeated string EntityTypes = 3; //实体类型
  repeated bytes EntityBytes = 4; //实体序列化后的bytes
}

message UnitCache2Other_AddOrUpdateUnit // IResponse
{
  int32 RpcId = 1;
  int32 Error = 2;
  string Message = 3;
}

//ResponseType UnitCache2Other_GetUnit
message Other2UnitCache_GetUnit // IRequest
{
  int32 RpcId = 1;
  int64 UnitId = 2;
  repeated string ComponentNameList = 3; //需要获取的组件名
}

message UnitCache2Other_GetUnit // IResponse
{
  int32 RpcId = 1;
  int32 Error = 2;
  string Message = 3;
  
  repeated bytes EntityList = 4;
  repeated string ComponentNameLIst = 5;
}