{
	int32 RpcId = 1;
}

message M2G_SecondLogin // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message MapTileInfoProto
{
	int32 configId = 1;
	repeated Unity.Mathematics.int2 tilePos = 2;
}

message ArchiveInfoProto
{
	int64 AccountHash = 1;
	int32 ArchiveNum = 2;
	repeated int64 Recruits = 3;
	repeated MapTileInfoProto MapTileInfos = 4;
}

//ResponseType Other2Archive_GetArchiveListResponse
message Other2Archive_GetArchiveListRequest // IRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
}

message Other2Archive_GetArchiveListResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ArchiveInfoProto ArchiveInfos = 4;
}

//ResponseType Other2Archive_AddNewArchiveResponse
message Other2Archive_AddNewArchiveRequest // IRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
}

message Other2Archive_AddNewArchiveResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int32 ArchiveNum = 4;
}

//ResponseType Other2Archive_UpdateArchiveResponse
message Other2Archive_UpdateArchiveRequest // IRequest
{
	int32 RpcId = 1;
	ArchiveInfoProto ArchiveInfo = 2;
}

message Other2Archive_UpdateArchiveResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

//ResponseType Other2Archive_RemoveArchiveResponse
message Other2Archive_RemoveArchiveRequest // IRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
	int32 ArchiveNum = 3;
}

message Other2Archive_RemoveArchiveResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

//ResponseType Other2Archive_SelectCurArchiveResponse
message Other2Archive_SelectCurArchiveRequest // IRequest
