syntax = "proto3";

package ET;

// ResponseType NetClient2Main_Login
message Main2NetClient_Login // IRequest
{
	int32 RpcId = 1;
	int32 OwnerFiberId = 2;
	string Address = 3;
	string Account = 4;		// 账号
	string Password = 5; 	// 密码
}

message NetClient2Main_Login // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;

	string Token = 4;
}

// ResponseType NetClient2Main_LoginGame
message Main2NetClient_LoginGame // IRequest
{
	int32 RpcId = 1;
	string Account = 2;
	int64 RealmKey = 3;
	string GateAddress = 4;
}

message NetClient2Main_LoginGame // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_Ping
message C2G_Ping // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Ping // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 Time = 4;
}

// ResponseType R2C_LoginAccount
message C2R_LoginAccount // ISessionRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
	string Password = 3;
}

message R2C_LoginAccount // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string Token = 4;
}

message ServerInfoProto
{
	int32 Id = 1;
	int32 Status = 2;
	string ServerName = 3;
}

// ResponseType R2C_GetServerInfos
message C2R_GetServerInfos // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
	string Account = 3;
}

message R2C_GetServerInfos // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ServerInfoProto ServerInfoList = 4;
}

// ResponseType R2C_GetRealmKey
message C2R_GetRealmKey // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
	string AccountName = 3;
	int32 ServerId = 4;
}

message R2C_GetRealmKey // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string Address = 4;
	int64 Key = 5;
	int64 GateId = 6;
}

// ResponseType G2C_LoginGameGate
message C2G_LoginGameGate // ISessionRequest
{
	int32 RpcId = 1;
	int64 Key = 2;
	string AccountName = 3;
}

message G2C_LoginGameGate // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_EnterGame
message C2G_EnterGame // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
}

message G2C_EnterGame // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message ArchiveInfoProto
{
	int64 AccountHash = 1;
	int32 ArchiveNum = 2;
	repeated int64 Recruits = 3;
	repeated byte[] MapTileInfos = 4;
}

//ResponseType C2Archive_GetArchiveListResponse
message C2Archive_GetArchiveListRequest // IActorArchiveRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
}

message C2Archive_GetArchiveListResponse // IActorArchiveResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ArchiveInfoProto ArchiveInfos = 4;
}

//ResponseType C2Archive_AddNewArchiveResponse
message C2Archive_AddNewArchiveRequest // IActorArchiveRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
}

message C2Archive_AddNewArchiveResponse // IActorArchiveResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int32 ArchiveNum = 4;
}

//ResponseType C2Archive_UpdateArchiveResponse
message C2Archive_UpdateArchiveRequest // IActorArchiveRequest
{
	int32 RpcId = 1;
	ArchiveInfoProto ArchiveInfo = 2;
}

message C2Archive_UpdateArchiveResponse // IActorArchiveResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

//ResponseType C2Archive_RemoveArchiveResponse
message C2Archive_RemoveArchiveRequest // IActorArchiveRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
	int32 ArchiveNum = 3;
}

message C2Archive_RemoveArchiveResponse // IActorArchiveResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

//ResponseType C2Archive_SelectCurArchiveResponse
message C2Archive_SelectCurArchiveRequest // IActorArchiveRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
	int32 ArchiveNum = 3;
}

message C2Archive_SelectCurArchiveResponse // IActorArchiveResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message C2Archive_RemoveCurArchive // IActorArchiveMessage
{
	int32 RpcId = 1;
	string AccountName = 2;
}