syntax = "proto3";

package ET;

// ResponseType NetClient2Main_Login
message Main2NetClient_Login // IRequest
{
	int32 RpcId = 1;
	int32 OwnerFiberId = 2;
	string Address = 3;
	string Account = 4;		// 账号
	string Password = 5; 	// 密码
}

message NetClient2Main_Login // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;

	string Token = 4;
}

// ResponseType NetClient2Main_LoginGame
message Main2NetClient_LoginGame // IRequest
{
	int32 RpcId = 1;
	string Account = 2;
	int64 RealmKey = 3;
	string GateAddress = 4;
}

message NetClient2Main_LoginGame // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_Ping
message C2G_Ping // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Ping // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 Time = 4;
}

// ResponseType R2C_LoginAccount
message C2R_LoginAccount // ISessionRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
	string Password = 3;
}

message R2C_LoginAccount // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string Token = 4;
}

message ServerInfoProto
{
	int32 Id = 1;
	int32 Status = 2;
	string ServerName = 3;
}

// ResponseType R2C_GetServerInfos
message C2R_GetServerInfos // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
	string Account = 3;
}

message R2C_GetServerInfos // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ServerInfoProto ServerInfoList = 4;
}

// ResponseType R2C_GetRealmKey
message C2R_GetRealmKey // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
	string AccountName = 3;
	int32 ServerId = 4;
}

message R2C_GetRealmKey // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string Address = 4;
	int64 Key = 5;
	int64 GateId = 6;
}

// ResponseType G2C_LoginGameGate
message C2G_LoginGameGate // ISessionRequest
{
	int32 RpcId = 1;
	int64 Key = 2;
	string AccountName = 3;
}

message G2C_LoginGameGate // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_EnterGame
message C2G_EnterGame // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
}

message G2C_EnterGame // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}


// ResponseType C2R_GetArchiveListResponse
message C2R_GetArchiveListRequest // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
	string AccountName = 3;
}

message C2R_GetArchiveListResponse // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ArchiveInfoProto ArchiveInfoList = 4;
}

// ResponseType C2R_AddNewArchiveResponse
message C2R_AddNewArchiveRequest // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
	string AccountName = 3;
}

message C2R_AddNewArchiveResponse // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ArchiveInfoProto ArchiveInfoList = 4;
}

// ResponseType C2R_RemoveArchiveResponse
message C2R_RemoveArchiveRequest // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
	string AccountName = 3;
	int32 ArchiveNum = 4;
}

message C2R_RemoveArchiveResponse // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType C2M_UpdateArchiveResponse
message C2M_UpdateArchiveRequest // ILocationRequest
{
	int32 RpcId = 1;
	string Token = 2;
	ArchiveInfoProto ArchiveInfoProto = 3;
}

message C2M_UpdateArchiveResponse // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType C2G_SelectOrAddArchiveResponse
message C2G_SelectOrAddArchiveRequest // ISessionRequest
{
	int32 RpcId = 1;
	string AccountName = 2;
	int32 ArchiveNum = 3;
}

message C2G_SelectOrAddArchiveResponse // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int32 ArchiveNum = 3;
}